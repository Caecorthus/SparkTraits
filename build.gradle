plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}"

    modImplementation name: 'wathe-1.5.6-spark-1.21.1'
    modImplementation name: 'noellesroles-1.7.6-h1.5.6-spark'
    modCompileOnly name: 'sparktraits-0.1.9.1'
}

// Build a direct replacement SparkTraits jar: original SparkTraits jar contents + Yuusha classes/resources.
jar {
    from(zipTree(layout.projectDirectory.file('libs/sparktraits-0.1.9.1.jar'))) {
        exclude 'fabric.mod.json'
        exclude 'sparktraits.mixins.json'
        exclude 'assets/sparktraits/lang/zh_cn.json'
        exclude 'assets/sparktraits/lang/en_us.json'
        exclude 'META-INF/MANIFEST.MF'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(21)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
